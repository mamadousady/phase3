# render.yaml - Version fonctionnelle pour Render
services:
  # Backend - API
  - type: web
    name: ambiance-api
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://ambiance-frontend.onrender.com

  # Frontend - Static Site
  - type: web
    name: ambiance-frontend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -l $PORT
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://ambiance-api.onrender.com
