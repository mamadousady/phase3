# render.yaml
services:
  # Backend - API (le serveur est dans Backends/)
  - type: web
    name: ambiance-api
    runtime: node
    buildCommand: |
      cd Backends
      npm install
    startCommand: |
      cd Backends
      node server.js
    healthCheckPath: /
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://ambiance-frontend.onrender.com

  # Frontend - React
  - type: web
    name: ambiance-frontend
    runtime: node
    buildCommand: |
      cd frontend
      npm install
      npm run build
    startCommand: |
      cd frontend
      npx serve -s dist -l $PORT
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://ambiance-api.onrender.com
